<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>实战妙手 · ChessDB</title>
    <meta name="description" content="精选中国国际象棋棋手及经典比赛中经引擎复核成立的精彩一步（!!）。真实对局，严格验算。">
    <link rel="icon" href="./assets/chessdb-favicon-light.png" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./assets/chessdb-favicon-dark.png" type="image/png" media="(prefers-color-scheme: dark)">
    <script src="theme.js?v=20260727-1"></script>
    <link rel="stylesheet" href="styles.css?v=20260916-quality">
    <style>
      .br-shell { width: 100%; max-width: 1180px; margin: 0 auto; padding: 24px 18px 80px; box-sizing: border-box; }
      .br-header { margin-bottom: 24px; }
      .br-header h1 { margin: 8px 0; font-size: 2rem; }
      .br-header p { color: var(--muted); margin: 0; font-size: 1rem; line-height: 1.5; }

      .br-toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 20px 0; }
      .br-toolbar input, .br-toolbar select {
        padding: 8px 14px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); color: var(--ink); font-size: 0.92rem;
      }
      .br-toolbar input:focus, .br-toolbar select:focus { outline: 2px solid var(--accent); }

      .br-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; width: 100%; }
      @media (min-width: 900px) {
        .br-layout { grid-template-columns: 460px minmax(0, 1fr); align-items: start; }
      }

      /* Board Container */
      .br-board-panel {
        background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        padding: 20px; box-shadow: var(--shadow); position: sticky; top: 20px;
        min-width: 0; width: 100%; box-sizing: border-box;
      }
      .br-board-wrap { width: 100%; aspect-ratio: 1; max-width: 420px; margin: 0 auto 16px; position: relative; }
      .br-board-svg { width: 100%; height: 100%; border-radius: 8px; user-select: none; display: block; }

      .br-mode-toggle { display: flex; gap: 8px; margin-bottom: 16px; background: var(--canvas); padding: 4px; border-radius: 8px; }
      .br-mode-btn {
        flex: 1; padding: 6px 12px; border: none; background: transparent; color: var(--muted);
        border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 500; transition: all .2s;
      }
      .br-mode-btn.active { background: var(--panel); color: var(--accent); font-weight: 600; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

      .br-move-badge {
        display: inline-flex; align-items: center; gap: 6px;
        background: #177a3d; color: #fff; padding: 4px 10px; border-radius: 6px;
        font-weight: 700; font-size: 1.1rem; letter-spacing: 0.5px;
      }
      .br-move-badge.red { background: #b3261e; }

      .br-info-title { margin: 12px 0 6px; font-size: 1.25rem; }
      .br-info-summary { color: var(--ink); line-height: 1.6; margin: 0 0 14px; font-size: 0.95rem; }

      .br-tabs { display: flex; gap: 12px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
      .br-tab-btn {
        padding: 8px 12px; border: none; background: transparent; color: var(--muted);
        cursor: pointer; font-size: 0.9rem; border-bottom: 2px solid transparent; margin-bottom: -1px;
      }
      .br-tab-btn.active { color: var(--accent); border-color: var(--accent); font-weight: 600; }
      .br-tab-content { font-size: 0.9rem; line-height: 1.6; color: var(--ink); min-height: 60px; word-break: break-word; }

      .br-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 16px 0; width: 100%; }
      .br-btn {
        padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px;
        background: var(--panel); color: var(--ink); cursor: pointer; font-size: 0.86rem;
        display: inline-flex; align-items: center; gap: 6px; text-decoration: none;
        max-width: 100%; box-sizing: border-box;
      }
      .br-btn:hover { background: var(--panel-soft); border-color: var(--accent); }
      .br-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
      .br-btn.primary:hover { background: var(--accent-strong); }

      .br-engine-meta {
        margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--line);
        font-size: 0.78rem; color: var(--muted); line-height: 1.4;
      }

      /* List Grid */
      .br-list-grid { display: flex; flex-direction: column; gap: 14px; min-width: 0; width: 100%; }
      .br-card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
        padding: 18px; cursor: pointer; transition: all .2s; position: relative;
        min-width: 0; box-sizing: border-box;
      }
      .br-card:hover { border-color: var(--accent); box-shadow: var(--shadow); transform: translateY(-1px); }
      .br-card.active { border-color: var(--accent); background: var(--accent-soft); }

      .br-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
      .br-card-move { font-size: 1.15rem; font-weight: 700; color: #177a3d; white-space: nowrap; }
      .br-card-players { font-size: 0.88rem; color: var(--muted); text-align: right; }
      .br-card-title { font-size: 1.05rem; font-weight: 600; margin: 0 0 6px; color: var(--ink); }
      .br-card-summary { font-size: 0.88rem; color: var(--muted); line-height: 1.5; margin: 0 0 10px; }
      .br-card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
      .br-tag {
        display: inline-block; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px;
        background: var(--canvas); color: var(--muted); border: 1px solid var(--line);
      }

      .br-guess-msg {
        margin: 10px 0; padding: 8px 12px; border-radius: 6px; font-size: 0.88rem;
        background: #eef7ee; color: #177a3d; display: none;
      }
      .br-guess-msg.error { background: #fdf2f2; color: #b3261e; }

      @media (max-width: 600px) {
        .br-shell { padding: 14px 10px 60px; }
        .page-nav { flex-wrap: wrap; gap: 10px; margin-bottom: 1.2rem; }
        .seo-nav { display: flex; flex-wrap: wrap; gap: 8px; font-size: 0.82rem; }
        .br-header h1 { font-size: 1.45rem; }
        .br-toolbar { flex-direction: column; align-items: stretch; gap: 8px; margin: 14px 0; }
        .br-toolbar input, .br-toolbar select { width: 100%; box-sizing: border-box; }
        .br-board-panel { padding: 12px; position: static; }
        .br-board-wrap { width: 100%; max-width: 100%; margin: 0 auto 12px; }
        .br-controls { gap: 6px; }
        .br-btn { padding: 6px 10px; font-size: 0.82rem; }
        .br-mode-btn { padding: 5px 8px; font-size: 0.82rem; }
        .br-card { padding: 14px; }
      }
      .br-guess-mode .br-card-move, .br-guess-mode .br-card-title, .br-guess-mode .br-card-summary, .br-guess-mode #seo-content { display:none; }
</style>
    <link rel="stylesheet" href="ui.css?v=20261003-1">
  </head>
  <body class="coverage-page">
    <a class="skip-link" href="#pageContent">跳到主要内容</a>
    <main id="pageContent" class="br-shell">
      <nav class="page-nav">
        <a class="compact-brand" href="./" aria-label="返回 4CHESS 中国国际象棋棋手数据库首页">
          <span class="theme-logo compact-brand-logo" aria-hidden="true">
            <img class="logo-on-light" src="assets/chessdb-logo-light.png" width="726" height="157" alt="">
            <img class="logo-on-dark" src="assets/chessdb-logo-dark.png" width="726" height="157" alt="">
          </span>
        </a>

        <nav class="topnav" aria-label="主要页面">

          <a href="./">查棋手</a>

          <a href="./events">赛事与棋谱</a>

          <a href="./leaderboards.html">排行榜</a>

          <a href="./master-series.html">棋协大师赛</a>

          <a href="./brilliancies" aria-current="page">实战妙手</a>

        </nav>
        <div class="theme-switcher" role="group" aria-label="外观主题">
          <button type="button" data-theme-choice="auto" aria-label="跟随系统主题" title="跟随系统主题">自动</button>
          <button type="button" data-theme-choice="light" aria-label="使用浅色主题" title="浅色主题">☀</button>
          <button type="button" data-theme-choice="dark" aria-label="使用深色主题" title="深色主题">☾</button>
        </div>
      </nav>

      <header class="br-header">
        <span class="eyebrow">Tactical Masterpieces & Brilliancies</span>
        <h1>实战妙手</h1>
        <p>精选真实比赛中下出的精彩一步（!!）。附引擎复核记录；“!!”是本站精选标签，不代表唯一最佳着法。附带实战后续与原局出处。</p>
      </header>

      <div class="br-toolbar">
        <input type="search" id="searchInput" placeholder="搜索棋手（如：丁立人、侯逸凡、韦奕）..." aria-label="搜索棋手">
        <select id="themeFilter" aria-label="按战术主题筛选">
          <option value="">全部主题</option>
          <option value="queen-sacrifice">弃后 (Queen Sacrifice)</option>
          <option value="rook-sacrifice">弃车 (Rook Sacrifice)</option>
          <option value="minor-piece-sacrifice">弃轻子 (Minor Piece Sacrifice)</option>
          <option value="exchange-sacrifice">交换牺牲 (Exchange Sacrifice)</option>
        </select>
        <select id="sortFilter" aria-label="排序方式">
          <option value="featured">精选推荐</option>
          <option value="newest">最新对局</option>
        </select>
        <span id="resultCount" style="color:var(--muted);font-size:0.88rem;margin-left:auto;">加载中…</span>
      </div>

      <div class="br-layout">
        <!-- Interactive Chessboard View -->
        <section class="br-board-panel" aria-label="妙手交互棋盘">
          <div class="br-mode-toggle">
            <button type="button" class="br-mode-btn active" id="modeWatchBtn">欣赏模式</button>
            <button type="button" class="br-mode-btn" id="modeGuessBtn">先猜一手</button>
          </div>

          <div class="br-board-wrap">
            <svg id="chessBoardSvg" class="br-board-svg" viewBox="0 0 400 400" aria-label="实战棋盘">
              <!-- Dynamically populated squares and pieces -->
            </svg>
          </div>

          <div id="guessMsg" class="br-guess-msg"></div>

          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
            <div id="moveBadge" class="br-move-badge">--</div>
            <div id="matchSummary" style="font-size:0.85rem; color:var(--muted);"></div>
          </div>

          <h2 id="brTitle" class="br-info-title">加载中…</h2>
          <p id="brSummary" class="br-info-summary">请从右侧列表中选择一条妙手欣赏。</p>

          <div class="br-tabs">
            <button type="button" class="br-tab-btn active" id="tabContinuation">实战后续</button>
            <button type="button" class="br-tab-btn" id="tabVariation">验证变化</button>
          </div>
          <div id="tabContent" class="br-tab-content"></div>

          <div class="br-controls">
            <button type="button" class="br-btn" id="prevBtn" title="上一步">◀ 上一步</button>
            <button type="button" class="br-btn primary" id="playBtn">▶ 妙手一击</button>
            <button type="button" class="br-btn" id="nextBtn" title="下一步">下一步 ▶</button>
            <button type="button" class="br-btn" id="resetBtn">↺ 复位</button>
            <button type="button" class="br-btn" id="toggleFullGameBtn" title="在当前棋盘回放完整原局">完整原局复盘</button>
            <a href="#" class="br-btn" id="fullGameLink" target="_blank" title="在新标签页的主库棋盘中打开整盘对局并定位妙手回合">在主库中打开原局 ↗</a>
            <a href="#" class="br-btn" id="downloadPgnLink" download>下载片段 PGN</a>
            <button type="button" class="br-btn" id="shareBtn">🔗 分享</button>
          </div>

          <div class="br-engine-meta">
            <details>
              <summary style="cursor:pointer;">复核记录与署名</summary>
              <div style="margin-top:8px;">
                <p>引擎：<span id="metaEngine">Stockfish 17.1</span>；<span id="metaBudget"></span></p>
                <p id="metaRights"></p>
                <p>规则版本：本站 2026-09-v1。<code>!!</code> 是本站的精选审核标记，代表该弃子成立且经引擎复核，不代表 Chess.com 等第三方平台的评级体系。</p>
              </div>
            </details>
          </div>
        </section>

        <!-- Brilliancies Cards List -->
        <section class="br-list-grid" id="brListContainer" aria-label="妙手精选列表">
          <!-- Dynamically populated cards -->
        </section>
      </div>
    </main>

    <script src="brilliancies.js"></script>
  </body>
</html>
