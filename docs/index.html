<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国国际象棋棋手数据库</title>
    <meta name="description" content="社区共建的中国国际象棋棋手数据库:全年龄组 FIDE 排行榜、棋手查询与对局 PGN。">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vendor/lichess-pgn-viewer/lichess-pgn-viewer.css">
    <link rel="stylesheet" href="styles.css?v=20260712-3">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="首页">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>
            <strong>中国国际象棋棋手数据库</strong>
            <small>社区共建 · 全年龄组数据库</small>
          </span>
        </a>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" aria-label="搜索棋手或赛事" placeholder="正在加载 2.6 万名棋手…" disabled>
        </label>

        <nav class="topnav" aria-label="主要页面">
          <a href="./leaderboards.html">FIDE 排行榜</a>
          <a href="./coverage.html">数据覆盖</a>
          <a href="./contribute.html">贡献数据</a>
        </nav>

      </header>

      <main class="workspace search-workspace">
        <section class="main-pane search-main-pane" id="mainPane">
          <section class="search-home" id="searchHome">
            <span class="eyebrow">China chess player archive</span>
            <h1>查找中国国际象棋棋手</h1>
            <p>输入中文名、拼音、FIDE ID，或赛事名称。至少输入两个字符。</p>
            <div class="search-suggestions" id="searchSuggestions"></div>
            <p class="search-trust" id="searchTrust" hidden></p>
          </section>
          <section class="search-results" id="searchResultsSection" hidden>
            <div class="section-heading">
              <h2>搜索结果</h2>
              <span id="searchCount">0 名</span>
            </div>
            <div class="result-list" id="searchResults"></div>
          </section>

          <aside class="detail-pane" id="detailPane" aria-label="棋手看板" hidden></aside>
          <aside class="event-pane" id="eventPane" aria-label="赛事看板" hidden></aside>
        </section>
      </main>
    </div>

    <script type="module" src="app.js?v=20260712-4"></script>
  </body>
</html>
