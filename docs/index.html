<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国国际象棋棋手数据库</title>
    <meta name="description" content="社区共建的中国国际象棋棋手数据库:全年龄组 FIDE 排行榜、棋手查询与对局 PGN。">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vendor/lichess-pgn-viewer/lichess-pgn-viewer.css">
    <link rel="stylesheet" href="styles.css?v=20260711-1">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="首页">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>
            <strong>中国国际象棋棋手数据库</strong>
            <small>社区共建 · 全年龄组数据库</small>
          </span>
        </a>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" aria-label="搜索棋手" placeholder="搜索棋手：中文名、拼音或 FIDE ID">
        </label>

      </header>

      <main class="workspace">
        <section class="content-pane">
          <section class="leaderboards" aria-label="FIDE 排行榜">
            <div class="section-heading">
              <h2>中国棋手 FIDE 积分排行榜</h2>
              <span id="rankingMeta">Top 20</span>
            </div>
            <div class="stage-tabs" id="stageTabs" role="tablist" aria-label="年龄组"></div>
            <p class="ranking-note" id="ageRuleText">加载年龄组定义...</p>
            <div class="leaderboard-grid" id="leaderboardGrid"></div>
          </section>
        </section>

        <section class="main-pane" id="mainPane">
          <section class="search-results" id="searchResultsSection" hidden>
            <div class="section-heading">
              <h2>搜索结果</h2>
              <span id="searchCount">0 名</span>
            </div>
            <div class="result-list" id="searchResults"></div>
          </section>

          <section class="dashboard" id="dashboardSection" aria-label="数据看板">
            <div class="dashboard-intro">
              <div>
                <span class="eyebrow">China chess data atlas</span>
                <h1>中国国际象棋棋手数据总览</h1>
              </div>
              <p>公开赛事记录、棋手身份与可复现 PGN 档案。</p>
            </div>
            <div class="stat-grid" id="statGrid"></div>
            <div class="dash-panels">
              <section class="dash-panel">
                <div class="section-heading">
                  <h2>最新收录赛事</h2>
                  <span id="recentEventsMeta"></span>
                </div>
                <div class="recent-events" id="recentEvents"></div>
              </section>
              <section class="dash-panel">
                <div class="section-heading">
                  <h2>数据更新记录</h2>
                  <span id="changelogMeta"></span>
                </div>
                <div class="changelog-list" id="changelogList"></div>
                <div class="section-heading">
                  <h2>年龄组棋手分布</h2>
                  <span>现役有分棋手</span>
                </div>
                <div class="age-overview" id="ageOverview"></div>
                <div class="section-heading">
                  <h2>社区数据贡献鸣谢</h2>
                  <span>感谢每一次抓取</span>
                </div>
                <div class="credits-list" id="creditsList"></div>
              </section>
            </div>
          </section>

          <aside class="detail-pane" id="detailPane" aria-label="棋手看板" hidden></aside>
          <aside class="event-pane" id="eventPane" aria-label="赛事看板" hidden></aside>
        </section>
      </main>
    </div>

    <script type="module" src="app.js?v=20260711-2"></script>
  </body>
</html>
