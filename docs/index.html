<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国青少年棋手库</title>
    <meta name="description" content="中国国际象棋青少年 FIDE 排行榜与棋手查询。">
    <link rel="stylesheet" href="vendor/lichess-pgn-viewer/lichess-pgn-viewer.css">
    <link rel="stylesheet" href="styles.css?v=20260703-1">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="首页">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>
            <strong>中国青少年棋手库</strong>
            <small>FIDE ELO · 李成智杯年龄组</small>
          </span>
        </a>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="中文名 / 拼音 / FIDE ID">
        </label>

      </header>

      <main class="workspace">
        <section class="content-pane">
          <section class="search-results" id="searchResultsSection" hidden>
            <div class="section-heading">
              <h2>搜索结果</h2>
              <span id="searchCount">0 名</span>
            </div>
            <div class="result-list" id="searchResults"></div>
          </section>

          <section class="leaderboards" aria-label="青少年 FIDE 排行榜">
            <div class="section-heading">
              <h1>青少年 FIDE 排行榜</h1>
              <span id="rankingMeta">Top 20</span>
            </div>
            <div class="stage-tabs" id="stageTabs" role="tablist" aria-label="年龄组"></div>
            <p class="ranking-note" id="ageRuleText">加载年龄组定义...</p>
            <div class="leaderboard-grid" id="leaderboardGrid"></div>
          </section>
        </section>

        <aside class="detail-pane" id="detailPane" aria-label="棋手看板">
          <div class="empty-state">加载棋手数据...</div>
        </aside>
      </main>
    </div>

    <script type="module" src="app.js?v=20260703-1"></script>
  </body>
</html>
