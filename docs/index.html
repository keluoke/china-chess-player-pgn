<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国青少年棋手库</title>
    <meta name="description" content="中国国际象棋青少年 FIDE 排行榜与棋手查询。">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="首页">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>
            <strong>中国青少年棋手库</strong>
            <small>FIDE ELO · 李成智杯年龄组</small>
          </span>
        </a>

        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="中文名 / 拼音 / FIDE ID">
        </label>

        <nav class="top-links" aria-label="项目链接">
          <a href="ARCHITECTURE.md">架构</a>
          <a href="DATA_WORKFLOW.md">数据机制</a>
          <a href="data/index/manifest.json">缓存</a>
        </nav>
      </header>

      <main class="workspace">
        <section class="content-pane">
          <section class="summary-band" aria-label="本地数据摘要">
            <div>
              <span class="metric-label">棋手</span>
              <strong id="playerCount">0</strong>
            </div>
            <div>
              <span class="metric-label">年龄组</span>
              <strong id="stageCount">0</strong>
            </div>
            <div>
              <span class="metric-label">重点赛事</span>
              <strong id="eventCount">0</strong>
            </div>
            <div>
              <span class="metric-label">bulk 对局</span>
              <strong id="bulkGameCount">0</strong>
            </div>
          </section>

          <section class="rule-band">
            <div class="rule-icon" aria-hidden="true">◎</div>
            <p id="ageRuleText">加载年龄组定义...</p>
          </section>

          <section class="search-results" id="searchResultsSection" hidden>
            <div class="section-heading">
              <h2>搜索结果</h2>
              <span id="searchCount">0 名</span>
            </div>
            <div class="result-list" id="searchResults"></div>
          </section>

          <section class="leaderboards" aria-label="青少年 FIDE 排行榜">
            <div class="section-heading">
              <h1>青少年 FIDE 排行榜</h1>
              <span id="rankingMeta">U8-U18</span>
            </div>
            <div class="stage-tabs" id="stageTabs" role="tablist" aria-label="年龄组"></div>
            <div class="leaderboard-grid" id="leaderboardGrid"></div>
          </section>

          <section class="bulk-youth" aria-label="青少年 bulk 对局筛选">
            <div class="section-heading">
              <h2>青少年对局筛选</h2>
              <span id="bulkYouthMeta">U8-U18</span>
            </div>
            <div class="bulk-grid" id="bulkYouthGrid"></div>
          </section>
        </section>

        <aside class="detail-pane" id="detailPane" aria-label="棋手看板">
          <div class="empty-state">加载棋手数据...</div>
        </aside>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
