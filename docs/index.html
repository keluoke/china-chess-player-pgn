<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>中国国际象棋棋手数据库</title>
    <meta name="description" content="社区共建的中国国际象棋棋手数据库:全年龄组 FIDE 排行榜、棋手查询与对局 PGN。">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="vendor/lichess-pgn-viewer/lichess-pgn-viewer.css">
    <link rel="stylesheet" href="styles.css?v=20260727-1">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="首页">
          <span class="brand-mark" aria-hidden="true">♜</span>
          <span>
            <strong>中国国际象棋棋手数据库</strong>
            <small>社区共建 · 全年龄组数据库</small>
          </span>
        </a>

        <nav class="topnav" aria-label="主要页面">
          <a href="./leaderboards.html">棋手排行榜</a>
        </nav>

      </header>

      <main class="workspace search-workspace">
        <section class="main-pane search-main-pane" id="mainPane">
          <section class="search-command" id="searchCommand" data-mode="hero">
            <span class="eyebrow">China chess player archive</span>
            <h1>查找中国国际象棋棋手</h1>
            <form id="searchForm" class="hero-search-form" action="./" method="get" role="search">
              <label class="search-box hero-search-box">
                <span aria-hidden="true">⌕</span>
                <input id="searchInput" name="q" type="search" autocomplete="off"
                  role="combobox" aria-autocomplete="list" aria-expanded="false"
                  aria-controls="searchResults" aria-label="搜索棋手或赛事"
                  placeholder="中文名 / 拼音 / FIDE ID / 赛事名">
              </label>
              <button type="submit">搜索</button>
            </form>
            <p class="search-guidance">支持单个汉字；补全姓名、拼音或 FIDE ID 可获得更精确的结果。</p>
          </section>
          <section class="search-home" id="searchHome">
            <div class="search-suggestions" id="searchSuggestions"></div>
            <p class="search-trust" id="searchTrust" hidden></p>
          </section>
          <section class="search-results" id="searchResultsSection" aria-live="polite" hidden>
            <div class="section-heading">
              <h2>搜索结果</h2>
              <span id="searchCount">0 名</span>
            </div>
            <div class="result-list" id="searchResults"></div>
          </section>

          <aside class="detail-pane" id="detailPane" aria-label="棋手看板" hidden></aside>
          <aside class="event-pane" id="eventPane" aria-label="赛事看板" hidden></aside>
        </section>
      </main>
      <footer class="site-footer">
        <span>数据展示遵循最小必要原则。</span>
        <a href="./contribute.html?type=privacy-request">删除或匿名化请求</a>
      </footer>
    </div>

    <script type="module" src="app.js?v=20260727-1"></script>
  </body>
</html>
