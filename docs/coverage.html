<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>数据覆盖与状态 · 中国国际象棋棋手数据库</title>
    <meta name="description" content="查看各年龄组棋谱覆盖率、数据状态、赛事补录计划与最近更新时间。">
    <link rel="icon" href="./assets/4chess-favicon-black.png" type="image/png" media="(prefers-color-scheme: light)">
    <link rel="icon" href="./assets/4chess-favicon-white.png" type="image/png" media="(prefers-color-scheme: dark)">
    <script src="theme.js?v=20260727-1"></script>
    <link rel="stylesheet" href="styles.css?v=20260729-1">
  </head>
  <body class="coverage-page">
    <main class="coverage-shell">
      <nav class="page-nav">
        <a class="compact-brand" href="./" aria-label="返回 4CHESS 中国国际象棋棋手数据库首页">
          <span class="theme-logo compact-brand-logo" aria-hidden="true">
            <img class="logo-on-light" src="assets/4chess-logo-black.png" width="442" height="95" alt="">
            <img class="logo-on-dark" src="assets/4chess-logo-white.png" width="289" height="61" alt="">
          </span>
        </a>
        <div class="theme-switcher" role="group" aria-label="外观主题">
          <button type="button" data-theme-choice="auto" aria-label="跟随系统主题" title="跟随系统主题">自动</button>
          <button type="button" data-theme-choice="light" aria-label="使用浅色主题" title="浅色主题">☀</button>
          <button type="button" data-theme-choice="dark" aria-label="使用深色主题" title="深色主题">☾</button>
        </div>
      </nav>
      <header class="coverage-head">
        <span class="eyebrow">Coverage & provenance</span>
        <h1>数据覆盖与状态</h1>
        <p>“查不到”不等于棋手不存在。这里公开展示已缓存、待比对和待补源的范围，以及当前数据快照的更新时间。</p>
      </header>
      <section id="coverageHeadline" class="coverage-headline" aria-live="polite"></section>
      <div class="coverage-grid">
        <section class="coverage-panel"><div class="section-heading"><h2>四类目标赛事更新</h2><span id="recentEventsMeta"></span></div><div id="coverageRecentEvents" class="recent-events"></div></section>
        <section class="coverage-panel"><div class="section-heading"><h2>数据更新记录</h2><span id="coverageChangelogMeta"></span></div><div id="coverageChangelog" class="changelog-list"></div></section>
      </div>
      <section class="coverage-panel">
        <div class="section-heading"><h2>各年龄段 PGN 覆盖</h2><span id="coverageUpdated"></span></div>
        <div id="stageCoverage" class="stage-coverage"></div>
      </section>
      <div class="coverage-grid">
        <section class="coverage-panel"><div class="section-heading"><h2>赛事整取队列</h2><span>需求驱动</span></div><div id="eventQueue"></div></section>
        <section class="coverage-panel"><div class="section-heading"><h2>质量审核</h2><span>纯离线</span></div><div id="qualityQueue"></div></section>
      </div>
      <section class="coverage-panel">
        <div class="section-heading"><h2>社区贡献漏斗</h2><span>每日更新</span></div>
        <div id="contributionFunnel"></div>
      </section>
      <section class="coverage-panel status-language">
        <div class="section-heading"><h2>全站状态语言</h2><span>统一口径</span></div>
        <div><span class="data-status cached">PGN 已缓存</span><p>本库已有可在线播放或下载的棋谱。</p></div>
        <div><span class="data-status compare">待数据源比对</span><p>已有赛事或棋手线索，尚未确认可公开棋谱。</p></div>
        <div><span class="data-status missing">待补源</span><p>只有公开成绩记录，仍缺明确棋谱来源。</p></div>
      </section>
      <p class="privacy-foundation">未认领低龄棋手默认只公开姓名、年龄组和赛事成绩；参赛单位收敛到省市级。<a href="./contribute.html?type=privacy-request">删除或匿名化请求</a>始终保持可达。</p>
    </main>
    <script type="module" src="coverage.js?v=20260731-1"></script>
  </body>
</html>
