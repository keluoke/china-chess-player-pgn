<header><h1>关于 ChessDB</h1><p>社区维护的中国国际象棋棋手与棋谱数据库。</p></header><h2>我们提供什么</h2><p>查找棋手、了解 FIDE 等级分、按赛事查看成绩并下载可复盘棋谱。本站是社区数据库，不是 FIDE 或中国国际象棋协会的官方网站。</p><h2>更正与反馈</h2><p>如发现姓名、身份或对局记录有误，请通过<a href="/contribute">贡献与勘误入口</a>提交线索。未核实的信息不会写成确定事实。</p><footer class="seo-footer"><p>包含 Lichess 广播棋谱的部分保留 <a href="https://lichess.org/broadcast">Lichess</a> 署名与 <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> 许可。</p><a href="/about">关于本站</a> · <a href="/methodology">数据与更新方法</a> · <a href="/developers">数据接口</a> · <a href="/contribute?type=privacy-request">勘误与隐私请求</a></footer></main></body></html>
