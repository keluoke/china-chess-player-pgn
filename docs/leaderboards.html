<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>棋手排行榜 · 中国国际象棋棋手数据库</title>
    <meta name="description" content="按年龄组、出生年份、棋种与性别筛选的中国棋手 FIDE 官方积分排行榜。">
    <link rel="icon" href="./brand.svg" type="image/svg+xml">
    <script src="theme.js?v=20260727-1"></script>
    <link rel="stylesheet" href="styles.css?v=20260727-3">
  </head>
  <body class="coverage-page">
    <main class="coverage-shell leaderboard-page-shell">
      <nav class="page-nav">
        <a class="compact-brand" href="./" aria-label="返回棋手数据库首页">
          <svg aria-hidden="true"><use href="./brand.svg#brand-mark"></use></svg>
          <span>中国国际象棋棋手数据库</span>
        </a>
        <div class="theme-switcher" role="group" aria-label="外观主题">
          <button type="button" data-theme-choice="auto" aria-label="跟随系统主题" title="跟随系统主题">自动</button>
          <button type="button" data-theme-choice="light" aria-label="使用浅色主题" title="浅色主题">☀</button>
          <button type="button" data-theme-choice="dark" aria-label="使用深色主题" title="深色主题">☾</button>
        </div>
      </nav>
      <header class="coverage-head">
        <span class="eyebrow">Official FIDE ratings</span>
        <h1>棋手排行榜</h1>
        <p>官方 FIDE 积分，按自然年龄分组；标准棋、快棋和超快棋独立排序，不混用分值。</p>
      </header>
      <section class="leaderboard-filters" aria-label="排行榜筛选">
        <div><span>棋种</span><div id="controlFilters" class="filter-chips"></div></div>
        <div><span>性别</span><div id="sexFilters" class="filter-chips"></div></div>
      </section>
      <div id="leaderboardTabs" class="segmented-stage-tabs" role="tablist" aria-label="年龄组"></div>
      <div id="birthYearFilters" class="birth-year-filters" hidden></div>
      <p id="leaderboardScopeNote" class="leaderboard-scope-note"></p>
      <section id="leaderboardPage" class="leaderboard-grid single-page-grid" aria-live="polite"></section>
    </main>
    <script type="module" src="leaderboards.js?v=20260726-3"></script>
  </body>
</html>
