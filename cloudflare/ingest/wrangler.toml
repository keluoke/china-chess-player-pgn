name = "chess-data-ingest-shadow"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = true

# This service is intentionally pinned to Workers Free.  Do not add paid
# bindings or raise these budgets without changing AGENTS.md and the reviewed
# contract in docs/CLOUDFLARE_INGEST_CONTRACT.md.
[vars]
SERVICE_MODE = "shadow"
MAX_DAILY_RELEASES = "8"
MAX_RELEASE_FILES = "384"
MAX_REGISTER_CHUNK_FILES = "10"
MAX_MERGE_CHUNK_FILES = "10"
MAX_RELEASE_BYTES = "100663296"
MAX_FILE_BYTES = "100663296"
MAX_SINGLE_UPLOAD_BYTES = "16777216"
MULTIPART_PART_BYTES = "8388608"
MAX_MULTIPART_PARTS = "12"
# Leave 128 MiB outside the persistent ledger for one in-flight multipart
# assembly.  The contract still hard-stops the entire bucket below 1 GiB.
MAX_SHADOW_STORAGE_BYTES = "939524096"
MAX_MONTHLY_R2_CLASS_A = "100000"
MAX_MONTHLY_R2_CLASS_B = "250000"
MAX_DAILY_D1_ROWS_READ = "100000"
MAX_DAILY_D1_ROWS_WRITTEN = "30000"
MAX_D1_STORAGE_BYTES = "134217728"
MAX_DAILY_QUEUE_OPS = "1000"
MAX_DAILY_WORKER_REQUESTS = "5000"

[[d1_databases]]
binding = "DB"
database_name = "chess-data-ingest-shadow"
database_id = "fb7575b4-b781-42d9-afab-d3773114e396"

[[r2_buckets]]
binding = "DATA"
bucket_name = "chess-ingest-shadow"

[[queues.producers]]
binding = "RELEASE_QUEUE"
queue = "chess-data-ingest-shadow"

[[queues.consumers]]
queue = "chess-data-ingest-shadow"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
