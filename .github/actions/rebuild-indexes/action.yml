name: Rebuild derived indexes
description: >-
  Rebuild every derived / index artifact from data already committed to the
  repository under ONE atomic snapshot id (Scripts/build_release_snapshot.py).
  This step performs NO source access, so it is safe to run on GitHub-hosted
  runners. It is the derived half of the local-release pipeline. If any build
  or validation step fails the snapshot aborts and nothing is committed, so
  the previous snapshot keeps serving.

inputs:
  apply-registry-aliases:
    description: Re-apply Chinese name aliases onto the committed registry (offline).
    required: false
    default: "true"
  rebuild-domestic:
    description: Rebuild the domestic (non-FIDE) registry from committed CSVs.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Rebuild derived indexes (offline, no network, one snapshot id)
      shell: bash
      run: |
        set -euo pipefail
        flags=()
        if [ "${{ inputs.apply-registry-aliases }}" != "true" ]; then
          flags+=("--skip-registry-aliases")
        fi
        if [ "${{ inputs.rebuild-domestic }}" != "true" ]; then
          flags+=("--skip-domestic")
        fi
        python3 Scripts/build_release_snapshot.py "${flags[@]+"${flags[@]}"}"
