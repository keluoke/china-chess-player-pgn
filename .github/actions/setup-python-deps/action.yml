name: Set up Python deps
description: >-
  Set up Python and install optional runtime dependencies.
  Shared by every workflow so the Python setup lives in one place.

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.x"
  packages:
    description: >-
      Space-separated pip packages to install (e.g. "certifi" or "chess").
      Leave empty to install nothing beyond the interpreter.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install runtime dependencies
      if: inputs.packages != ''
      shell: bash
      run: python3 -m pip install --upgrade ${{ inputs.packages }}
