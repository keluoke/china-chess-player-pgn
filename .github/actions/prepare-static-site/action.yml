name: Prepare static site artifact
description: >-
  Build the static site payload from docs/ (excluding the multi-hundred-MB
  Lichess bulk shards) and enforce per-file / total size limits. Shared by the
  GitHub Pages and Cloudflare Pages deploy jobs.

inputs:
  output-dir:
    description: Directory to assemble the site into.
    required: false
    default: ".static-site"
  max-file-mib:
    description: Reject the deploy if any single file is larger than this (MiB).
    required: false
    default: "24"
  max-total-kib:
    description: Reject the deploy if the whole artifact exceeds this (KiB).
    required: false
    default: "870400"

runs:
  using: composite
  steps:
    - name: Assemble and size-check site
      shell: bash
      run: |
        set -euo pipefail
        out="${{ inputs.output-dir }}"
        rm -rf "$out"
        rsync -a --delete \
          --exclude 'data/bulk/lichess-broadcast/shards/*.pgn.zst' \
          --exclude 'data/registry/domestic/identity-review.json' \
          docs/ "$out"/

        # The domestic identity review queue contains maintenance-only scores
        # and adjudication evidence. It is intentionally not a public frontend
        # artifact (and omitting it also keeps the deploy package bounded).

        # Bulk stage packs can legitimately exceed the per-file hosting limit
        # (e.g. the adult broadcast pack). They are secondary downloads — the
        # per-player packs carry the same games — so DROP oversize bulk packs
        # from the artifact instead of failing the whole deploy.
        find "$out/data/bulk" -type f -size +${{ inputs.max-file-mib }}M -print -delete 2>/dev/null           | sed 's/^/dropped oversize bulk file: /' || true

        if find "$out" -type f -size +${{ inputs.max-file-mib }}M -print -quit | grep -q .; then
          echo "Static site contains a file larger than ${{ inputs.max-file-mib }} MiB; split it before deploy." >&2
          find "$out" -type f -size +${{ inputs.max-file-mib }}M -print >&2
          exit 1
        fi

        size_kib="$(du -sk "$out" | awk '{print $1}')"
        if [ "$size_kib" -gt ${{ inputs.max-total-kib }} ]; then
          echo "Static site artifact is ${size_kib} KiB; keep it below ${{ inputs.max-total-kib }} KiB before deploy." >&2
          exit 1
        fi
        echo "Prepared $out (${size_kib} KiB)."
