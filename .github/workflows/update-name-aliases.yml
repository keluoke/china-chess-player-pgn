name: Update Chinese name aliases

# NETWORK / SCRAPING workflow — scrapes chess-results.com player lists and
# rebuilds the FIDE registry. Self-hosted (residential-IP) runner only, no
# schedule. Prefer the local script: `Scripts/local/refresh.sh aliases`.
# Commits RAW aliases + registry; by-player index rebuild + deploy happen in
# rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      extra_url:
        description: "Optional extra Chess-Results player-list URL to scrape"
        required: false
        type: string
      include_non_master:
        description: "Accept pages whose title is not a known master/league event"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: update-name-aliases
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Scrape Chinese names from Chess-Results player lists
        shell: bash
        env:
          EXTRA_URL: ${{ inputs.extra_url }}
          INCLUDE_NON_MASTER: ${{ inputs.include_non_master }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${EXTRA_URL:-}" ]; then
            args+=(--url "$EXTRA_URL")
          fi
          if [ "${INCLUDE_NON_MASTER:-false}" = "true" ]; then
            args+=(--include-non-master)
          fi
          python3 Scripts/sync_chess_results_starting_rank_aliases.py "${args[@]}"

      # ratings.fide.com can be unreachable even from residential IPs; fall back
      # to applying aliases offline against the committed registry.
      - name: Rebuild Chinese player registry with aliases
        id: full_rebuild
        continue-on-error: true
        run: python3 Scripts/sync_chinese_players.py

      - name: Apply aliases offline (FIDE download fallback)
        if: steps.full_rebuild.outcome == 'failure'
        run: python3 Scripts/apply_aliases_to_registry.py

      - name: Commit raw aliases and registry
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update Chinese name aliases from Chess-Results" data/manual docs/data/registry

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
