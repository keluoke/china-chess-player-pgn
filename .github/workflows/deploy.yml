name: Deploy static site

# Cloudflare Pages is the ONLY publishing target: GitHub manages code,
# Cloudflare serves the site. (GitHub Pages deployment removed 2026-07.)
# Triggered by:
#   - direct human pushes to site code in docs/** (normal edits)
#   - workflow_dispatch                           (manual / from rebuild-indexes)
#   - workflow_call                               (reuse from other workflows)
# docs/data/** is EXCLUDED from the push trigger: data pushes go through
# rebuild-indexes.yml first (which rebuilds derived indexes and then dispatches
# this workflow), so triggering here too would deploy stale indexes and run the
# whole deploy twice. Bot commits (github-actions[bot]) do NOT fire the push
# event, so data workflows dispatch this explicitly after committing.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "!docs/data/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/prepare-static-site/**"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

jobs:
  cloudflare-pages:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        uses: ./.github/actions/prepare-static-site
        with:
          output-dir: .cloudflare-pages-site
          max-file-mib: "25"

      - name: Deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 80b22ae648eae984f0c2678f0812cf7d
          command: pages deploy .cloudflare-pages-site --project-name china-chess-player-pgn --branch main

      # Fail loudly instead of silently skipping, so a missing/rotated token
      # can't leave Cloudflare quietly serving a stale site.
      - name: Check token configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN secret is not set; Cloudflare Pages was NOT deployed." >&2
          exit 1
