name: Deploy static site
run-name: Deploy exact ${{ inputs.target_sha || github.sha }}

# Cloudflare Pages is the ONLY publishing target: GitHub manages code,
# Cloudflare serves the site. (GitHub Pages deployment removed 2026-07.)
# Triggered by:
#   - direct human pushes to site code in docs/** (normal edits)
#   - workflow_dispatch                           (manual / from rebuild-indexes)
#   - workflow_call                               (reuse from other workflows)
# docs/data/** is EXCLUDED from the push trigger: data pushes go through
# rebuild-indexes.yml first (which rebuilds derived indexes and then dispatches
# this workflow), so triggering here too would deploy stale indexes and run the
# whole deploy twice. Bot commits (github-actions[bot]) do NOT fire the push
# event, so data workflows dispatch this explicitly after committing.
on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "!docs/data/**"
      - "functions/**"
      - ".github/workflows/deploy.yml"
      - ".github/actions/prepare-static-site/**"
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact repository commit to deploy.
        required: true
        type: string
  workflow_call:
    inputs:
      target_sha:
        description: Exact repository commit to deploy.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-static-site
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.seo.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
      - name: Require matching generated public pages
        id: seo
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if python3 Scripts/validate_seo_pages.py; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "push" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Public page inputs changed; the unified rebuild will dispatch the matching deployment." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "SEO_REBUILD_REQUIRED: refusing a mixed public page snapshot" >&2
            exit 1
          fi
  cloudflare-pages:
    needs: readiness
    if: needs.readiness.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || github.sha }}
          fetch-depth: 1

      - name: Verify exact deploy base
        id: target
        env:
          EXPECTED_DEPLOY_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if ! [[ "$EXPECTED_DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$actual" != "$EXPECTED_DEPLOY_SHA" ]; then
            echo "DEPLOY_BASE_MISMATCH: expected $EXPECTED_DEPLOY_SHA, checked out $actual" >&2
            exit 1
          fi
          snapshot_id="$(python3 -c 'import json; print(json.load(open("docs/data/snapshot.json")).get("snapshotId", ""))')"
          input_commit="$(python3 -c 'import json; print(json.load(open("docs/data/snapshot.json")).get("inputCommit", ""))')"
          if [ -z "$snapshot_id" ] || ! [[ "$input_commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "DEPLOY_RECEIPT_INVALID: snapshotId/inputCommit missing or invalid" >&2
            exit 1
          fi
          echo "target_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "snapshot_id=$snapshot_id" >> "$GITHUB_OUTPUT"
          echo "input_commit=$input_commit" >> "$GITHUB_OUTPUT"

      - name: Set up product verification
        uses: ./.github/actions/setup-python-deps
        with:
          packages: chess==1.11.2

      - name: Require rebuilt game quality before publication
        run: |
          python3 - <<'PYCODE'
          import json
          manifest = json.load(open('data/generated/player-game-facts/manifest.json'))
          if 'playableGames' not in manifest.get('totals', {}):
              raise SystemExit('GAME_QUALITY_REBUILD_REQUIRED: rebuild this code before deployment')
          PYCODE
          python3 Scripts/validate_game_quality.py

      - name: Verify registry belongs to the validated snapshot
        run: |
          python3 Scripts/validate_registry_snapshot.py
          python3 Scripts/validate_registry_authority.py

      - name: Verify player PGN R2 receipt
        id: r2-receipt
        run: |
          set -euo pipefail
          python3 Scripts/validate_player_pgn_r2_receipt.py
          python3 Scripts/event_pgn_objects.py --validate --receipt-only
          echo "event_sha256=$(sha256sum docs/data/index/event-pgn-r2-receipt.json | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"
          receipt_sha="$(sha256sum docs/data/index/player-pgn-r2-receipt.json | awk '{print $1}')"
          if ! [[ "$receipt_sha" =~ ^[0-9a-f]{64}$ ]]; then
            echo "DEPLOY_RECEIPT_INVALID: R2 receipt hash invalid" >&2
            exit 1
          fi
          echo "sha256=$receipt_sha" >> "$GITHUB_OUTPUT"

      - name: Prepare site
        uses: ./.github/actions/prepare-static-site
        with:
          output-dir: .cloudflare-pages-site
          max-file-mib: "25"

      - name: Read previous public discovery baseline
        run: |
          curl -sSL --compressed --max-time 30 https://chessdb.aigclabs.cc/data/seo-public.json -o /tmp/seo-previous.json || true
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          p = Path('/tmp/seo-previous.json')
          try:
              value = json.loads(p.read_text())
              assert isinstance(value.get('pages'), list)
          except (OSError, ValueError, AssertionError, AttributeError):
              p.write_text('{}')
          PYCODE

      - name: Deploy
        id: deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: 80b22ae648eae984f0c2678f0812cf7d
          command: pages deploy .cloudflare-pages-site --project-name china-chess-player-pgn --branch main

      # Fail loudly instead of silently skipping, so a missing/rotated token
      # can't leave Cloudflare quietly serving a stale site.
      - name: Check token configured
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' }}
        run: |
          echo "CLOUDFLARE_API_TOKEN secret is not set; Cloudflare Pages was NOT deployed." >&2
          exit 1

      - name: Verify ordinary production product routes
        id: product-canary
        env:
          EXPECTED_SNAPSHOT: ${{ steps.target.outputs.snapshot_id }}
        run: |
          for attempt in 1 2 3; do
            python3 Scripts/verify_product_canary.py --expect-snapshot "$EXPECTED_SNAPSHOT" --output /tmp/product-canary.json && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Save product verification receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: product-canary
          path: /tmp/product-canary.json
          if-no-files-found: ignore

      - name: Verify SEO routes and readable HTML
        run: |
          for attempt in 1 2 3; do
            python3 Scripts/verify_seo_online.py --output /tmp/seo-canary.json && exit 0
            if [ "$attempt" -lt 3 ]; then sleep 30; fi
          done
          exit 1

      - name: Notify search engines of verified content changes
        run: python3 Scripts/notify_search_engines.py --previous /tmp/seo-previous.json --submit --output /tmp/indexnow-receipt.json

      - name: Record search observation baseline
        run: python3 Scripts/seo_observation_report.py --output /tmp/seo-observation.json

      - name: Save SEO verification and discovery receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seo-verification
          path: |
            /tmp/seo-canary.json
            /tmp/indexnow-receipt.json
            /tmp/seo-observation.json
            /tmp/seo-previous.json
          if-no-files-found: ignore

      - name: Record exact deployment receipt
        if: ${{ always() }}
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          SNAPSHOT_ID: ${{ steps.target.outputs.snapshot_id }}
          INPUT_COMMIT: ${{ steps.target.outputs.input_commit }}
          R2_RECEIPT_SHA256: ${{ steps.r2-receipt.outputs.sha256 }}
          EVENT_R2_RECEIPT_SHA256: ${{ steps.r2-receipt.outputs.event_sha256 }}
        run: |
          {
            echo "## Exact deployment receipt"
            echo
            echo "- target SHA: \`$TARGET_SHA\`"
            echo "- snapshot ID: \`$SNAPSHOT_ID\`"
            echo "- snapshot input: \`$INPUT_COMMIT\`"
            echo "- player PGN R2 receipt: \`$R2_RECEIPT_SHA256\`"
            echo "- event PGN R2 receipt: \`$EVENT_R2_RECEIPT_SHA256\`"
            echo "- target gate: \`${{ steps.target.outcome }}\`"
            echo "- R2 gate: \`${{ steps.r2-receipt.outcome }}\`"
            echo "- product canary: \`${{ steps.product-canary.outcome }}\`"
            echo "- deploy action: \`${{ steps.deploy.outcome }}\`"
            echo "- conclusion: \`${{ job.status }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
