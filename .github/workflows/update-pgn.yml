name: Update static PGN archive

# NETWORK / SCRAPING workflow — fetches missing PGN from chess-results.com,
# which blocks GitHub datacenter IPs. Self-hosted (residential-IP) runner only,
# no schedule. Prefer the local script: `Scripts/local/refresh.sh pgn`.
# Commits RAW PGN; index rebuild + deploy happen in rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID to update one player"
        required: false
        type: string
      max_downloads:
        description: "Maximum PGN downloads in this run; 0 means no limit"
        required: true
        default: "50"
        type: string
      fetch_missing:
        description: "Fetch missing PGNs from configured public sources"
        required: true
        default: true
        type: boolean
      source:
        description: "Data source to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chess-results

permissions:
  contents: write
  actions: write

concurrency:
  group: update-static-pgn
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch missing PGN
        shell: bash
        env:
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          PLAYER_FIDE_ID: ${{ inputs.player_fide_id }}
          FETCH_MISSING: ${{ inputs.fetch_missing }}
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail

          max_downloads="${MAX_DOWNLOADS:-50}"
          source="${SOURCE:-all}"

          args=()
          if [ "${FETCH_MISSING:-true}" = "true" ]; then
            args+=(--fetch-missing --max-downloads "$max_downloads")
          fi
          if [ -n "${PLAYER_FIDE_ID:-}" ]; then
            args+=(--player "$PLAYER_FIDE_ID")
          fi
          if [ "$source" != "all" ]; then
            args+=(--source "$source")
          fi

          python3 Scripts/sync_static_pgn.py "${args[@]}"

      - name: Commit raw PGN archive
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update static PGN archive" docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
