name: Update static PGN archive

on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID to update one player"
        required: false
        type: string
      max_downloads:
        description: "Maximum PGN downloads in this run; 0 means no limit"
        required: true
        default: "50"
        type: string
      fetch_missing:
        description: "Fetch missing PGNs from configured public sources"
        required: true
        default: true
        type: boolean
      source:
        description: "Data source to update"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - chess-results
  schedule:
    - cron: "18 19 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-static-pgn
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync static PGN archive
        shell: bash
        env:
          MAX_DOWNLOADS: ${{ inputs.max_downloads }}
          PLAYER_FIDE_ID: ${{ inputs.player_fide_id }}
          FETCH_MISSING: ${{ inputs.fetch_missing }}
          SOURCE: ${{ inputs.source }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          max_downloads="$MAX_DOWNLOADS"
          player_fide_id="$PLAYER_FIDE_ID"
          fetch_missing="$FETCH_MISSING"
          source="$SOURCE"
          if [ -z "$max_downloads" ]; then
            max_downloads=50
          fi
          if [ -z "$source" ]; then
            source=all
          fi

          args=()
          if [ "$EVENT_NAME" = "schedule" ] || [ "$fetch_missing" = "true" ]; then
            args+=(--fetch-missing --max-downloads "$max_downloads")
          fi
          if [ -n "$player_fide_id" ]; then
            args+=(--player "$player_fide_id")
          fi
          if [ "$source" != "all" ]; then
            args+=(--source "$source")
          fi

          python3 Scripts/sync_static_pgn.py "${args[@]}"
          python3 Scripts/build_static_player_pgn.py

      - name: Commit updated archive
        run: bash Scripts/ci_commit_push.sh "Update static PGN archive" docs/data

      - name: Trigger mimic profile refresh
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-mimic-profiles.yml --ref main -R "$GITHUB_REPOSITORY"
