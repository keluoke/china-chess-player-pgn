name: Crawl player events (SpielerSuche)

# NETWORK / SCRAPING workflow — hits chess-results.com, which blocks GitHub's
# datacenter IPs. Runs on a self-hosted (residential-IP) runner only, and never
# on a schedule. Prefer the local script: `Scripts/local/refresh.sh crawl`.
# It commits RAW crawl output; index rebuild + deploy happen in
# rebuild-indexes.yml on a GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      player:
        description: "single FIDE ID to crawl (empty = all CHN registry)"
        required: false
        default: ""
        type: string
      max_players:
        description: "cap number of players (0 = no limit)"
        required: false
        default: "0"
        type: string
      refresh_days:
        description: "only re-crawl players not seen in N days (0 = crawl all)"
        required: false
        default: "30"
        type: string
      delay:
        description: "seconds between player searches"
        required: false
        default: "1.0"
        type: string
      fetch_games:
        description: "also pull PGN for discovered tournaments"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-player-events
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Crawl player database and build tournament index
        env:
          PLAYER: ${{ inputs.player }}
          MAX_PLAYERS: ${{ inputs.max_players }}
          REFRESH_DAYS: ${{ inputs.refresh_days }}
          REQ_DELAY: ${{ inputs.delay }}
          FETCH_GAMES: ${{ inputs.fetch_games }}
        run: |
          set -euo pipefail
          args=(--delay "${REQ_DELAY:-1.0}" --workers 2)
          if [ -n "${PLAYER:-}" ]; then
            args+=(--player "$PLAYER")
          else
            args+=(--max-players "${MAX_PLAYERS:-0}")
            if [ -n "${REFRESH_DAYS:-}" ] && [ "${REFRESH_DAYS}" != "0" ]; then
              args+=(--refresh-days "${REFRESH_DAYS}")
            fi
          fi
          if [ "${FETCH_GAMES:-true}" = "true" ]; then
            args+=(--fetch-games)
          fi
          python3 Scripts/crawl_player_events.py "${args[@]}"

      - name: Commit raw crawl output
        id: commit
        run: bash Scripts/ci_commit_push.sh "Crawl Chess-Results player events" data/manual docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
