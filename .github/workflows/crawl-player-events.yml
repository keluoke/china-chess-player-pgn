name: Crawl player events (SpielerSuche)

on:
  workflow_dispatch:
    inputs:
      player:
        description: "single FIDE ID to crawl (empty = all CHN registry)"
        required: false
        default: ""
        type: string
      max_players:
        description: "cap number of players (0 = no limit)"
        required: false
        default: "0"
        type: string
      refresh_days:
        description: "only re-crawl players not seen in N days (0 = crawl all)"
        required: false
        default: "30"
        type: string
      delay:
        description: "seconds between player searches"
        required: false
        default: "1.0"
        type: string
      fetch_games:
        description: "also pull PGN for discovered tournaments"
        required: false
        default: true
        type: boolean
  schedule:
    # Weekly incremental refresh, Mondays 03:30 UTC.
    - cron: "30 3 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: crawl-player-events
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Crawl player database and build tournament index
        env:
          PLAYER: ${{ inputs.player }}
          MAX_PLAYERS: ${{ inputs.max_players }}
          REFRESH_DAYS: ${{ inputs.refresh_days }}
          REQ_DELAY: ${{ inputs.delay }}
          FETCH_GAMES: ${{ inputs.fetch_games }}
        run: |
          set -euo pipefail
          args=(--delay "${REQ_DELAY:-1.0}" --workers 2)
          if [ -n "${PLAYER:-}" ]; then
            args+=(--player "$PLAYER")
          else
            args+=(--max-players "${MAX_PLAYERS:-0}")
            # schedule runs pass refresh_days via default; dispatch honors input
            if [ -n "${REFRESH_DAYS:-}" ] && [ "${REFRESH_DAYS}" != "0" ]; then
              args+=(--refresh-days "${REFRESH_DAYS}")
            fi
          fi
          if [ "${FETCH_GAMES:-true}" = "true" ]; then
            args+=(--fetch-games)
          fi
          python3 Scripts/crawl_player_events.py "${args[@]}"

      - name: Rebuild static PGN index
        run: python3 Scripts/sync_static_pgn.py

      - name: Rebuild by-player static index
        run: python3 Scripts/build_static_player_pgn.py

      - name: Commit crawl output
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual docs/data
          if git diff --cached --quiet; then
            echo "No player-event changes."
          else
            git commit -m "Crawl Chess-Results player events and rebuild indexes"
            n=0
            until git push; do
              n=$((n+1))
              if [ "$n" -ge 3 ]; then
                echo "push failed after $n attempts" >&2
                exit 1
              fi
              git pull --rebase origin main
              sleep 10
            done
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger site deploys
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml --ref main -R "$GITHUB_REPOSITORY"
          gh workflow run cloudflare-pages.yml --ref main -R "$GITHUB_REPOSITORY"
