name: Update Lichess broadcast bulk archive

# NETWORK workflow — mirrors large Lichess broadcast .pgn.zst shards. Self-hosted
# (residential-IP / good bandwidth) runner only, no schedule. Prefer the local
# script: `Scripts/local/refresh.sh bulk`. Commits RAW bulk shards; youth-pack /
# index rebuild + deploy happen in rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      mirror:
        description: "Mirror Lichess broadcast .pgn.zst shards"
        required: true
        default: false
        type: boolean
      index_youth:
        description: "Rebuild U8-U18 youth PGN packs"
        required: true
        default: false
        type: boolean
      max_shards:
        description: "Limit newest shards; 0 means all"
        required: true
        default: "0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-lichess-broadcast-bulk
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync Lichess broadcast bulk archive
        shell: bash
        env:
          MIRROR: ${{ inputs.mirror }}
          INDEX_YOUTH: ${{ inputs.index_youth }}
          MAX_SHARDS: ${{ inputs.max_shards }}
        run: |
          set -euo pipefail
          args=(--metadata-only --max-shards "${MAX_SHARDS:-0}")
          if [ "${MIRROR:-false}" = "true" ]; then
            args+=(--mirror)
          fi
          if [ "${INDEX_YOUTH:-false}" = "true" ]; then
            args+=(--index-youth)
          fi
          python3 Scripts/sync_lichess_broadcast_bulk.py "${args[@]}"

      - name: Commit updated bulk archive
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update Lichess broadcast bulk archive" docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
