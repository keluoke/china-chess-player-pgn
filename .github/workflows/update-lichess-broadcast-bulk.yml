name: Update Lichess broadcast bulk archive

on:
  workflow_dispatch:
    inputs:
      mirror:
        description: "Mirror Lichess broadcast .pgn.zst shards"
        required: true
        default: false
        type: boolean
      index_youth:
        description: "Rebuild U8-U18 youth PGN packs"
        required: true
        default: false
        type: boolean
      max_shards:
        description: "Limit newest shards; 0 means all"
        required: true
        default: "0"
        type: string
  schedule:
    - cron: "42 18 7 * *"

permissions:
  contents: write

concurrency:
  group: update-lichess-broadcast-bulk
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync Lichess broadcast bulk archive
        shell: bash
        env:
          MIRROR: ${{ inputs.mirror }}
          INDEX_YOUTH: ${{ inputs.index_youth }}
          MAX_SHARDS: ${{ inputs.max_shards }}
        run: |
          set -euo pipefail

          mirror="$MIRROR"
          index_youth="$INDEX_YOUTH"
          max_shards="$MAX_SHARDS"
          if [ -z "$mirror" ]; then
            mirror=false
          fi
          if [ -z "$index_youth" ]; then
            index_youth=false
          fi
          if [ -z "$max_shards" ]; then
            max_shards=0
          fi

          args=(--metadata-only --max-shards "$max_shards")
          if [ "$mirror" = "true" ]; then
            args+=(--mirror)
          fi
          if [ "$index_youth" = "true" ]; then
            args+=(--index-youth)
          fi

          python3 Scripts/sync_lichess_broadcast_bulk.py "${args[@]}"
          python3 Scripts/build_static_player_pgn.py

      - name: Commit updated bulk archive
        run: bash Scripts/ci_commit_push.sh "Update Lichess broadcast bulk archive" docs/data
