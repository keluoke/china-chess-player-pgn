name: Rebuild indexes and deploy

# The offline index/deploy half of the local-release pipeline. Maintainer-local
# collection delivers only validated, manifest-listed public projections;
# this GitHub-hosted workflow rebuilds derived artifacts without source access.
#
# Triggers:
#   - push to main touching reviewed/manual or validated machine inputs
#   - workflow_dispatch from the manifest ingest workflow or a maintainer
#
# Loop guard: the job's own commit is authored by github-actions[bot]; the
# `if` below skips bot-authored pushes so a rebuild never retriggers itself.
on:
  push:
    branches: ["main"]
    paths:
      - "data/manual/**"
      - "data/community/**"
      - "data/generated/**"
      - "docs/data/pgn/**"
      - "docs/data/registry/**"
      - "docs/data/bulk/**"
      - "Scripts/**"
      - ".github/actions/rebuild-indexes/**"
      - ".github/workflows/rebuild-indexes.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rebuild-indexes
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python-deps

      - name: Rebuild derived indexes
        uses: ./.github/actions/rebuild-indexes

      - name: Commit rebuilt indexes
        id: commit
        run: bash Scripts/ci_commit_push.sh "Rebuild derived indexes" docs/data docs/api data/generated

      # Always dispatch the deploy: even if the rebuild itself produced no new
      # commit, the push that triggered this run already changed docs/data,
      # and deploy.yml deliberately ignores docs/data/** pushes.
      - name: Deploy static site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's dispatch API occasionally 500s; retry before failing.
          for i in 1 2 3; do
            gh workflow run deploy.yml --ref main -R "$GITHUB_REPOSITORY" && exit 0
            echo "dispatch attempt $i failed; retrying in 20s" >&2
            sleep 20
          done
          exit 1
