name: Pages

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .pages-site
          rsync -a --delete \
            --exclude 'data/bulk/lichess-broadcast/shards/*.pgn.zst' \
            docs/ .pages-site/
          find .pages-site -type f -size +24M -print -quit | grep -q . && {
            echo "Pages artifact contains a file larger than 24 MiB; split it before deploy." >&2
            exit 1
          } || true
          size_kib="$(du -sk .pages-site | awk '{print $1}')"
          if [ "$size_kib" -gt 870400 ]; then
            echo "Pages artifact is ${size_kib} KiB; keep it below 850 MiB before deploy." >&2
            exit 1
          fi

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-site

      # The Pages service occasionally rejects deployments with a transient
      # "Deployment failed, try again later" during syncing_files, so retry
      # once after a cool-down before failing the run.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Deploy (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Report deploy result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          first="${{ steps.deployment.outcome }}"
          retry="${{ steps.deployment_retry.outcome }}"
          echo "first attempt: $first, retry: $retry"
          if [ "$first" != "success" ] && [ "$retry" != "success" ]; then
            echo "Both deploy attempts failed." >&2
            exit 1
          fi
