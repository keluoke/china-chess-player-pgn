name: Validate community data

# Offline-only validation. Source links are reviewed by the maintainer; CI and
# community contributors never fetch Chess-Results.
on:
  pull_request:
    paths:
      - "data/**"
  push:
    branches: ["main"]
    paths:
      - "data/manual/**"
      - "data/community/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-deps
      - name: Validate community data files
        run: |
          python3 Scripts/validate_community_data.py
          python3 Scripts/validate_master_group_labels.py
