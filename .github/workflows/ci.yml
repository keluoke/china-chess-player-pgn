name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python-deps
        with:
          packages: pyyaml

      - name: Byte-compile all scripts
        run: python3 -m compileall -q Scripts

      - name: Validate community-maintained data
        run: python3 Scripts/validate_community_data.py

      - name: Validate workflow and action YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in glob.glob(".github/workflows/*.yml") + glob.glob(".github/actions/*/action.yml"):
              try:
                  yaml.safe_load(open(path))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("workflow and action YAML OK")
          PY
