name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python-deps
        with:
          packages: pyyaml pypinyin==0.55.0

      - name: Byte-compile all scripts
        run: python3 -m compileall -q Scripts

      - name: Run unit and regression tests
        run: |
          before=$(git status --porcelain)
          python3 -m unittest discover -s Scripts/tests
          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "Tests mutated the working tree" >&2
            git status --short
            exit 1
          fi

      - name: Validate frontend modules
        run: |
          node --check docs/app.js
          node --check docs/leaderboards.js
          node Scripts/tests/frontend_presentation_names_test.mjs
          node Scripts/tests/frontend_search_core_test.mjs
          node Scripts/tests/pgn_proxy_test.mjs

      - name: Validate local shell entrypoint
        run: bash -n Scripts/local/refresh.sh

      - name: Validate community-maintained data
        run: |
          python3 Scripts/validate_community_data.py
          python3 Scripts/validate_master_group_labels.py

      - name: Validate identity clustering against embedded FIDE truth
        run: python3 Scripts/validate_identity_clustering.py --check-only

      - name: Reject scraped community payloads; validate target-only submissions
        run: python3 Scripts/validate_incoming.py

      - name: Public manifests must share one metric contract
        run: |
          python3 Scripts/build_public_metrics.py
          python3 Scripts/build_api.py
          python3 Scripts/build_changelog.py
          python3 Scripts/build_dashboard.py
          python3 Scripts/validate_public_metrics.py

      - name: Public surface must not expose raw club/school strings (minors)
        run: python3 Scripts/validate_public_privacy.py

      - name: Target-submission PRs must only touch data/incoming/
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          # This is a path-scope check, so compare the two trees directly.
          # A three-dot diff requires a locally available merge base and fails
          # on shallow/API-created PR branches with "no merge base".
          changed=$(git diff --name-only "origin/${{ github.base_ref }}" HEAD)
          if echo "$changed" | grep -Eq '^data/incoming/[0-9]{8}-[0-9]{6}-[0-9a-f]{6}/'; then
            outside=$(echo "$changed" | grep -Ev '^data/incoming/[0-9]{8}-[0-9]{6}-[0-9a-f]{6}/' || true)
            if [ -n "$outside" ]; then
              echo "目标线索 PR 不允许同时修改其他路径:"; echo "$outside"; exit 1
            fi
          fi

      - name: Validate workflow and action YAML
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in glob.glob(".github/workflows/*.yml") + glob.glob(".github/actions/*/action.yml"):
              try:
                  yaml.safe_load(open(path))
              except Exception as exc:
                  bad.append(f"{path}: {exc}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("workflow and action YAML OK")
          PY
