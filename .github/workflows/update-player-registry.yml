name: Update Chinese player registry

# NETWORK / SCRAPING workflow — downloads the full FIDE rating-list XML, which
# is often unreachable from GitHub datacenter IPs. Self-hosted (residential-IP)
# runner only, no schedule. Prefer the local script:
# `Scripts/local/refresh.sh registry`.
#
# NOTE: this step intentionally has NO offline fallback. If the FIDE download
# fails the run fails loudly, rather than silently leaving ratings stale — the
# offline `apply_aliases_to_registry.py` only patches names, never ratings.
on:
  workflow_dispatch:
    inputs:
      federation:
        description: "Federation code"
        required: true
        default: "CHN"
        type: string
      source_url:
        description: "FIDE rating-list export URL"
        required: true
        default: "https://ratings.fide.com/download/players_list_xml_legacy.zip"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-chinese-player-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Sync Chinese player registry
        shell: bash
        env:
          FEDERATION: ${{ inputs.federation }}
          SOURCE_URL: ${{ inputs.source_url }}
        run: |
          set -euo pipefail
          federation="${FEDERATION:-CHN}"
          source_url="${SOURCE_URL:-https://ratings.fide.com/download/players_list_xml_legacy.zip}"
          python3 Scripts/sync_chinese_players.py \
            --federation "$federation" \
            --url "$source_url"

      - name: Commit updated registry
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update Chinese player registry" docs/data/registry

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
