name: Ingest local data branch

# The local machine force-pushes a single-writer branch, but CI no longer
# mirrors broad data directories.  It validates the release manifest and
# applies only its exact hashed file list.  Manual/community paths and raw
# Chess-Results evidence are rejected by the shared policy validator.
on:
  push:
    branches: ["local-data"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-local-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Ingest only needs the current main tree plus the immutable release
          # SHA fetched below. actions/checkout@v4 automatically uses a
          # blob:none fetch when sparse-checkout is set, so historical data
          # blobs and machine-data roots stay absent until the manifest selects
          # exact files.
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/docs/data/
            !/data/generated/
            !/docs/api/

      - name: Resolve immutable source SHA
        id: source
        run: |
          set -euo pipefail
          # A push event carries the exact commit that triggered this run.
          # Using it (instead of re-reading the moving local-data head) keeps
          # two rapid force-pushes from cross-ingesting each other's release.
          if [ "${{ github.event_name }}" = "push" ]; then
            sha="${{ github.sha }}"
          else
            git fetch origin local-data
            sha="$(git rev-parse origin/local-data)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Apply exact validated local release
        id: apply
        run: |
          set -euo pipefail
          # Baseline validation compares the immutable release commit with its
          # single parent before touching the sparse worktree/index.
          git fetch --depth=2 origin "${{ steps.source.outputs.sha }}"
          result="$(python3 Scripts/local/run_manager.py apply \
            --repo . \
            --source-ref "${{ steps.source.outputs.sha }}" \
            --path-list "$RUNNER_TEMP/local-release-paths.txt")"
          echo "$result"
          run_id="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("runId") or "")')"
          baseline_commit="$(printf '%s' "$result" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("baseline") or {}).get("baselineCommit") or "")')"
          baseline_mode="$(printf '%s' "$result" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("baseline") or {}).get("baselineMode") or "")')"
          baseline_verified="$(printf '%s' "$result" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("baseline") or {}).get("verified") or 0)')"
          idempotent_paths="$(printf '%s' "$result" | python3 -c 'import json,sys; print((json.load(sys.stdin).get("baseline") or {}).get("idempotent") or 0)')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "baseline_commit=$baseline_commit" >> "$GITHUB_OUTPUT"
          echo "baseline_mode=$baseline_mode" >> "$GITHUB_OUTPUT"
          echo "baseline_verified=$baseline_verified" >> "$GITHUB_OUTPUT"
          echo "idempotent_paths=$idempotent_paths" >> "$GITHUB_OUTPUT"

      - name: Validate staged registry when present
        run: |
          set -euo pipefail
          if grep -q '^docs/data/registry/' "$RUNNER_TEMP/local-release-paths.txt"; then
            python3 Scripts/validate_registry_release.py \
              --registry docs/data/registry \
              --corrections data/community/name-corrections.csv
          fi

      - name: Commit as bot
        id: commit
        env:
          # Triggered by a push to local-data, but the mirror commit goes to
          # main — without this the script would push HEAD:local-data.
          PUSH_BRANCH: main
          CI_COMMIT_FORCE_ADD: "true"
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path; do
            [ -n "$path" ] && paths+=("$path")
          done < "$RUNNER_TEMP/local-release-paths.txt"
          bash Scripts/ci_commit_push.sh \
            "Ingest validated local release ${{ steps.apply.outputs.run_id }}" \
            "${paths[@]}"
          echo "main_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Write ingest receipt
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Local release ingest receipt"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| release run-id | \`${{ steps.apply.outputs.run_id || 'n/a' }}\` |"
            echo "| source (event) SHA | \`${{ steps.source.outputs.sha }}\` |"
            echo "| validated baseline | \`${{ steps.apply.outputs.baseline_commit || 'n/a' }}\` |"
            echo "| baseline mode | \`${{ steps.apply.outputs.baseline_mode || 'n/a' }}\` |"
            echo "| baseline paths verified | \`${{ steps.apply.outputs.baseline_verified || '0' }}\` |"
            echo "| idempotent paths | \`${{ steps.apply.outputs.idempotent_paths || '0' }}\` |"
            echo "| main commit | \`${{ steps.commit.outputs.main_sha || 'n/a' }}\` |"
            echo "| committed | \`${{ steps.commit.outputs.committed || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          workflow_inputs: >-
            {"target_sha":"${{ steps.commit.outputs.main_sha }}"}
          token: ${{ github.token }}
