name: Ingest local data branch

# The local machine force-pushes a single-writer branch, but CI no longer
# mirrors broad data directories.  It validates the release manifest and
# applies only its exact hashed file list.  Manual/community paths and raw
# Chess-Results evidence are rejected by the shared policy validator.
on:
  push:
    branches: ["local-data"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ingest-local-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve immutable source SHA
        id: source
        run: |
          set -euo pipefail
          # A push event carries the exact commit that triggered this run.
          # Using it (instead of re-reading the moving local-data head) keeps
          # two rapid force-pushes from cross-ingesting each other's release.
          if [ "${{ github.event_name }}" = "push" ]; then
            sha="${{ github.sha }}"
          else
            git fetch origin local-data
            sha="$(git rev-parse origin/local-data)"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Apply exact validated local release
        id: apply
        run: |
          set -euo pipefail
          git fetch origin "${{ steps.source.outputs.sha }}"
          result="$(python3 Scripts/local/run_manager.py apply \
            --repo . \
            --source-ref "${{ steps.source.outputs.sha }}" \
            --path-list "$RUNNER_TEMP/local-release-paths.txt")"
          echo "$result"
          run_id="$(printf '%s' "$result" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("runId") or "")')"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Validate staged registry when present
        run: |
          set -euo pipefail
          if grep -q '^docs/data/registry/' "$RUNNER_TEMP/local-release-paths.txt"; then
            python3 Scripts/validate_registry_release.py \
              --registry docs/data/registry \
              --corrections data/community/name-corrections.csv
          fi

      - name: Commit as bot
        id: commit
        env:
          # Triggered by a push to local-data, but the mirror commit goes to
          # main — without this the script would push HEAD:local-data.
          PUSH_BRANCH: main
        run: |
          set -euo pipefail
          paths=()
          while IFS= read -r path; do
            [ -n "$path" ] && paths+=("$path")
          done < "$RUNNER_TEMP/local-release-paths.txt"
          bash Scripts/ci_commit_push.sh "Ingest validated local release" "${paths[@]}"

      - name: Write ingest receipt
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Local release ingest receipt"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| release run-id | \`${{ steps.apply.outputs.run_id || 'n/a' }}\` |"
            echo "| source (event) SHA | \`${{ steps.source.outputs.sha }}\` |"
            echo "| main commit | \`$(git rev-parse HEAD)\` |"
            echo "| committed | \`${{ steps.commit.outputs.committed || 'false' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
