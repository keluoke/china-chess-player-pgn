name: Update domestic player registry

# PURE workflow (no network): builds the domestic (non-FIDE) identity layer from
# committed CSVs. Stays on GitHub-hosted runners. Runs on CSV changes or manually.
on:
  push:
    branches: ["main"]
    paths:
      - "data/manual/domestic-player-sightings.csv"
      - "data/manual/player-identity-links.csv"
      - "Scripts/sync_domestic_players.py"
      - "Scripts/build_domestic_progressions.py"
      - "data/community/master-tournament-groups.csv"
      - ".github/workflows/update-domestic-registry.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-domestic-player-registry
  cancel-in-progress: false

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python-deps

      - name: Sync domestic player registry
        run: |
          python3 Scripts/sync_domestic_players.py
          python3 Scripts/build_domestic_progressions.py

      - name: Commit updated domestic registry
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update domestic player registry" docs/data/registry/domestic

      - name: Deploy static site
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: deploy.yml
          token: ${{ github.token }}
