name: Update domestic player registry

on:
  push:
    branches: ["main"]
    paths:
      - "data/manual/domestic-player-sightings.csv"
      - "data/manual/player-identity-links.csv"
      - "Scripts/sync_domestic_players.py"
      - ".github/workflows/update-domestic-registry.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-domestic-player-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sync domestic player registry
        run: python3 Scripts/sync_domestic_players.py

      - name: Commit updated domestic registry
        run: bash Scripts/ci_commit_push.sh "Update domestic player registry" docs/data/registry/domestic
