name: Reconcile PGN sources

# NETWORK / SCRAPING workflow — probes chess-results.com for coverage gaps and
# promotes/fetches missing PGN. Self-hosted (residential-IP) runner only, no
# schedule. Prefer the local script: `Scripts/local/refresh.sh reconcile`.
# Commits RAW reconciled data; index rebuild + deploy happen in
# rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID to scan first"
        required: false
        type: string
      discover_chess_results:
        description: "Probe Chess-Results known gaps and neighbor TournamentIDs"
        required: true
        default: true
        type: boolean
      promote_public_pgn:
        description: "Promote Chess-Results PGN for the staged player batch"
        required: true
        default: true
        type: boolean
      max_players:
        description: "Chess-Results player batch size"
        required: true
        default: "120"
        type: string
      max_known_missing:
        description: "Known missing Chess-Results pairs to probe/fetch"
        required: true
        default: "80"
        type: string
      max_neighbor_ids:
        description: "Neighbor TournamentID pages to probe"
        required: true
        default: "80"
        type: string
      max_games:
        description: "Maximum new games to promote; 0 means no limit"
        required: true
        default: "0"
        type: string
      delay:
        description: "Delay between Chess-Results requests"
        required: true
        default: "1.2"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: reconcile-pgn-sources
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Reconcile and optionally promote PGN
        shell: bash
        env:
          PLAYER_FIDE_ID: ${{ inputs.player_fide_id }}
          DISCOVER_CHESS_RESULTS: ${{ inputs.discover_chess_results }}
          PROMOTE_PUBLIC_PGN: ${{ inputs.promote_public_pgn }}
          MAX_PLAYERS: ${{ inputs.max_players }}
          MAX_KNOWN_MISSING: ${{ inputs.max_known_missing }}
          MAX_NEIGHBOR_IDS: ${{ inputs.max_neighbor_ids }}
          MAX_GAMES: ${{ inputs.max_games }}
          DELAY: ${{ inputs.delay }}
        run: |
          set -euo pipefail

          discover_chess_results="${DISCOVER_CHESS_RESULTS:-true}"
          promote_public_pgn="${PROMOTE_PUBLIC_PGN:-true}"
          max_players="${MAX_PLAYERS:-120}"
          max_known_missing="${MAX_KNOWN_MISSING:-80}"
          max_neighbor_ids="${MAX_NEIGHBOR_IDS:-80}"
          max_games="${MAX_GAMES:-0}"
          delay="${DELAY:-1.2}"

          reconcile_args=(--write-audit --delay "$delay")
          if [ "$discover_chess_results" = "true" ]; then
            reconcile_args+=(
              --discover-chess-results
              --max-players "$max_players"
              --max-known-missing "$max_known_missing"
              --max-neighbor-ids "$max_neighbor_ids"
            )
          fi
          if [ -n "${PLAYER_FIDE_ID:-}" ]; then
            reconcile_args+=(--player "$PLAYER_FIDE_ID")
          fi

          python3 Scripts/reconcile_pgn_sources.py "${reconcile_args[@]}"

          if [ "$promote_public_pgn" = "true" ]; then
            player_args=()
            if [ -f docs/data/audit/chess-results-player-batch.csv ]; then
              while IFS= read -r fide_id; do
                if [ -n "$fide_id" ]; then
                  player_args+=(--player "$fide_id")
                fi
              done < <(python3 - <<'PY'
          import csv
          from pathlib import Path
          path = Path("docs/data/audit/chess-results-player-batch.csv")
          if path.exists():
              for row in csv.DictReader(path.open(encoding="utf-8")):
                  fide_id = (row.get("fideID") or "").strip()
                  if fide_id:
                      print(fide_id)
          PY
          )
            fi

            if [ "${#player_args[@]}" -gt 0 ]; then
              python3 Scripts/promote_public_pgn.py \
                --scan-chess-results \
                "${player_args[@]}" \
                --max-players 0 \
                --max-games "$max_games" \
                --delay "$delay" \
                --skip-index
            else
              echo "No staged Chess-Results player batch to promote."
            fi

            python3 Scripts/sync_static_pgn.py \
              --fetch-missing \
              --source chess-results \
              --max-downloads "$max_known_missing" \
              --delay "$delay"
            python3 Scripts/reconcile_pgn_sources.py --write-audit
          fi

      - name: Commit reconciled data
        id: commit
        run: bash Scripts/ci_commit_push.sh "Reconcile PGN source coverage" docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
