name: Ingest event archive (names + PGN)

# NETWORK / SCRAPING workflow — scrapes chess-results.com for names and full
# event PGN. Self-hosted (residential-IP) runner only, no schedule. Prefer the
# local script: `Scripts/local/refresh.sh events`. Commits RAW names + PGN;
# index rebuild + deploy happen in rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      category:
        description: "sources CSV category to ingest PGN for (empty = all rows)"
        required: false
        default: "li-chengzhi"
        type: string
      delay:
        description: "seconds between Chess-Results requests"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: update-event-archive
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install runtime dependencies
        run: python3 -m pip install --upgrade certifi

      - name: Scrape names from starting ranks
        env:
          REQ_DELAY: ${{ inputs.delay }}
        run: |
          set -euo pipefail
          python3 Scripts/sync_chess_results_starting_rank_aliases.py \
            --delay "${REQ_DELAY:-1.0}"

      - name: Rebuild Chinese player registry with aliases
        id: full_rebuild
        continue-on-error: true
        run: python3 Scripts/sync_chinese_players.py

      - name: Apply aliases offline (FIDE download fallback)
        if: steps.full_rebuild.outcome == 'failure'
        run: python3 Scripts/apply_aliases_to_registry.py

      - name: Fetch full-event PGN and split per player
        env:
          CATEGORY: ${{ inputs.category }}
        run: |
          set -euo pipefail
          args=(--workers 3)
          if [ -n "${CATEGORY:-}" ]; then
            args+=(--category "$CATEGORY")
          fi
          python3 Scripts/fetch_event_pgn.py "${args[@]}"

      - name: Commit raw event archive
        id: commit
        run: bash Scripts/ci_commit_push.sh "Ingest event archive names and PGN" data/manual docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
