name: Promote public PGN

on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID; empty scans registry/index batch"
        required: false
        type: string
      max_players:
        description: "Maximum Chess-Results player IDs to scan; 0 means no limit"
        required: true
        default: "25"
        type: string
      max_games:
        description: "Maximum new games to promote; 0 means no limit"
        required: true
        default: "0"
        type: string
      scan_chess_results:
        description: "Scan Chess-Results by FIDE ID"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: promote-public-pgn
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Promote public PGN
        shell: bash
        run: |
          set -euo pipefail

          args=()
          if [ "${{ inputs.scan_chess_results }}" != "true" ]; then
            echo "No promotion source selected."
            exit 0
          fi
          args+=(--scan-chess-results)
          if [ -n "${{ inputs.player_fide_id }}" ]; then
            args+=(--player "${{ inputs.player_fide_id }}")
          fi

          python3 Scripts/promote_public_pgn.py \
            "${args[@]}" \
            --max-players "${{ inputs.max_players }}" \
            --max-games "${{ inputs.max_games }}"
          python3 Scripts/build_static_player_pgn.py

      - name: Commit promoted PGN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No promoted PGN changes."
          else
            git commit -m "Promote public PGN archive"
            git push
          fi
