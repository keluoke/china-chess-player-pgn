name: Promote public PGN

# NETWORK / SCRAPING workflow — scans chess-results.com by FIDE ID. Self-hosted
# (residential-IP) runner only, no schedule. Prefer the local script:
# `Scripts/local/refresh.sh promote`. Commits RAW promoted PGN; index rebuild +
# deploy happen in rebuild-indexes.yml.
on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID; empty scans registry/index batch"
        required: false
        type: string
      max_players:
        description: "Maximum Chess-Results player IDs to scan; 0 means no limit"
        required: true
        default: "25"
        type: string
      max_games:
        description: "Maximum new games to promote; 0 means no limit"
        required: true
        default: "0"
        type: string
      scan_chess_results:
        description: "Scan Chess-Results by FIDE ID"
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: promote-public-pgn
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Promote public PGN
        shell: bash
        env:
          PLAYER_FIDE_ID: ${{ inputs.player_fide_id }}
          MAX_PLAYERS: ${{ inputs.max_players }}
          MAX_GAMES: ${{ inputs.max_games }}
          SCAN_CHESS_RESULTS: ${{ inputs.scan_chess_results }}
        run: |
          set -euo pipefail

          if [ "$SCAN_CHESS_RESULTS" != "true" ]; then
            echo "No promotion source selected."
            exit 0
          fi

          args=(--scan-chess-results)
          if [ -n "$PLAYER_FIDE_ID" ]; then
            args+=(--player "$PLAYER_FIDE_ID")
          fi

          python3 Scripts/promote_public_pgn.py \
            "${args[@]}" \
            --max-players "$MAX_PLAYERS" \
            --max-games "$MAX_GAMES" \
            --skip-index

      - name: Commit promoted PGN
        id: commit
        run: bash Scripts/ci_commit_push.sh "Promote public PGN archive" docs/data

      - name: Trigger index rebuild + deploy
        if: steps.commit.outputs.committed == 'true'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: rebuild-indexes.yml
          token: ${{ github.token }}
