name: Update mimic profiles

# PURE workflow (no network): builds youth mimic profiles from committed PGN.
# Stays on GitHub-hosted runners; keeps its weekly schedule.
on:
  workflow_dispatch:
    inputs:
      player_fide_id:
        description: "Optional FIDE ID to rebuild one player"
        required: false
        type: string
      force:
        description: "Rebuild even when the PGN hash is unchanged"
        required: true
        default: false
        type: boolean
      max_players:
        description: "Maximum players to rebuild; 0 means no limit"
        required: true
        default: "0"
        type: string
  schedule:
    - cron: "38 20 * * 0"

permissions:
  contents: write
  actions: write

concurrency:
  group: update-mimic-profiles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-python-deps
        with:
          packages: chess

      - name: Build youth mimic profiles
        shell: bash
        env:
          PLAYER_FIDE_ID: ${{ inputs.player_fide_id }}
          FORCE: ${{ inputs.force }}
          MAX_PLAYERS: ${{ inputs.max_players }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${PLAYER_FIDE_ID:-}" ]; then
            args+=(--player "$PLAYER_FIDE_ID")
          fi
          if [ "${FORCE:-false}" = "true" ]; then
            args+=(--force)
          fi
          if [ -n "${MAX_PLAYERS:-}" ] && [ "$MAX_PLAYERS" != "0" ]; then
            args+=(--max-players "$MAX_PLAYERS")
          fi
          python3 Scripts/build_youth_mimic_profiles.py "${args[@]}"

      - name: Commit updated mimic profiles
        id: commit
        run: bash Scripts/ci_commit_push.sh "Update youth mimic profiles" docs/mimic/profiles docs/data/mimic

      - name: Deploy static site
        if: steps.commit.outputs.committed == 'true' && github.ref_name == 'main'
        uses: ./.github/actions/dispatch-workflow
        with:
          workflow: deploy.yml
          token: ${{ github.token }}
