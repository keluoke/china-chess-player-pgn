<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模拟对局 - Zhang, Hongya</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="vendor/chessground/chessground.base.css">
<link rel="stylesheet" href="vendor/chessground/chessground.brown.css">
<link rel="stylesheet" href="vendor/chessground/chessground.cburnett.css">
<style>
  :root {
    color-scheme: light;
    --canvas: #f5f5f7;
    --panel: #ffffff;
    --panel-soft: #fbfbfd;
    --line: #d8d8de;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --accent: #0066cc;
    --accent-strong: #0057b8;
    --accent-soft: #eaf3ff;
    --gold: #8a6500;
    --gold-soft: #fff7dc;
    --danger: #a23b34;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.07);
  }

  * {
    box-sizing: border-box;
  }

  html {
    height: 100%;
    min-width: 320px;
    background: var(--canvas);
  }

  body {
    height: 100%;
    margin: 0;
    color: var(--text);
    background: var(--canvas);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
    letter-spacing: 0;
    overflow: hidden;
  }

  a {
    color: inherit;
    text-decoration: none;
  }

  button,
  input {
    font: inherit;
  }

  button {
    cursor: pointer;
  }

  button:disabled,
  input:disabled {
    cursor: not-allowed;
    opacity: 0.48;
  }

  .app-shell {
    display: flex;
    flex-direction: column;
    width: min(1500px, 100%);
    height: 100dvh;
    margin: 0 auto;
  }

  .topbar {
    flex: 0 0 auto;
    z-index: 10;
    display: grid;
    grid-template-columns: minmax(220px, 320px) minmax(240px, 1fr);
    gap: 16px;
    align-items: center;
    padding: 14px 24px;
    background: rgba(245, 245, 247, 0.82);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(22px);
  }

  .brand {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 10px;
  }

  .brand-mark {
    display: grid;
    place-items: center;
    flex: 0 0 auto;
    width: 38px;
    height: 38px;
    color: #ffffff;
    background: linear-gradient(180deg, #0a84ff, #0057b8);
    border-radius: 8px;
    font-size: 22px;
  }

  .brand strong,
  .brand small {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .brand strong {
    font-size: 16px;
  }

  .brand small {
    margin-top: 2px;
    color: var(--muted);
    font-size: 12px;
  }

  .search-wrap {
    position: relative;
    min-width: 0;
  }

  .search-box {
    display: flex;
    align-items: center;
    min-width: 0;
    gap: 10px;
    height: 44px;
    padding: 0 14px;
    background: rgba(255, 255, 255, 0.82);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .search-box span {
    color: var(--accent);
    font-size: 20px;
  }

  .search-box input {
    width: 100%;
    min-width: 0;
    color: var(--text);
    background: transparent;
    border: 0;
    outline: 0;
  }

  .search-results {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    left: 0;
    z-index: 30;
    max-height: min(360px, 60dvh);
    overflow-y: auto;
    padding: 6px;
    background: rgba(255, 255, 255, 0.98);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 16px 38px rgba(0, 0, 0, 0.12);
  }

  .search-results[hidden] {
    display: none;
  }

  .search-result {
    display: grid;
    width: 100%;
    min-height: 54px;
    padding: 8px 10px;
    color: var(--text);
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 6px;
  }

  .search-result:hover,
  .search-result:focus-visible {
    background: var(--accent-soft);
    outline: 0;
  }

  .search-result strong,
  .search-result span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .search-result strong {
    font-size: 14px;
  }

  .search-result span {
    margin-top: 3px;
    color: var(--muted);
    font-size: 12px;
  }

  .workspace {
    display: grid;
    grid-template-columns: minmax(300px, 360px) minmax(0, 1fr);
    flex: 1 1 auto;
    gap: 20px;
    min-height: 0;
    overflow: hidden;
    padding: 22px 24px 32px;
  }

  .content-pane {
    min-width: 0;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    align-self: stretch;
  }

  .section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 12px;
  }

  .section-heading h1,
  .section-heading h2 {
    margin: 0;
    color: var(--text);
    font-size: 20px;
    letter-spacing: 0;
  }

  .section-heading span {
    color: var(--muted);
    font-size: 13px;
    white-space: nowrap;
  }

  .leaderboard-card,
  .detail-pane {
    background: rgba(255, 255, 255, 0.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: var(--shadow);
    animation: paneIn 420ms ease both;
  }

  .leaderboard-card {
    min-width: 0;
    overflow: hidden;
    padding: 14px;
  }

  .leaderboard-card + .leaderboard-card {
    margin-top: 12px;
  }

  .detail-pane {
    align-self: stretch;
    min-width: 0;
    max-height: 100%;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-gutter: stable;
    padding: 22px;
  }

  .detail-title {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }

  .detail-title h2 {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin: 0;
    overflow-wrap: anywhere;
    font-size: clamp(26px, 3vw, 42px);
    line-height: 1.06;
    letter-spacing: 0;
  }

  .detail-title p {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.45;
  }

  .detail-title-actions {
    display: flex;
    flex: 0 0 auto;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px;
  }

  .stage-chip,
  .ai-badge,
  .beta-badge {
    display: inline-grid;
    place-items: center;
    flex: 0 0 auto;
    min-height: 30px;
    padding: 6px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0;
  }

  .stage-chip {
    color: #ffffff;
    background: #1d1d1f;
  }

  .ai-badge {
    color: #ffffff;
    background: linear-gradient(180deg, #0a84ff, #0057b8);
    box-shadow: 0 8px 18px rgba(0, 102, 204, 0.22);
  }

  .beta-badge {
    color: #174b7c;
    background: var(--accent-soft);
    border: 1px solid rgba(42, 110, 178, 0.2);
  }

  .rating-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
    margin: 14px 0;
  }

  .rating-card {
    min-width: 0;
    padding: 10px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .rating-card span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .rating-card strong {
    display: block;
    margin-top: 6px;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
  }

  .stage-tabs button,
  .action-link,
  .primary-action,
  .tool-button {
    min-height: 34px;
    padding: 7px 10px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .stage-tabs button:hover,
  .action-link:hover,
  .tool-button:hover {
    border-color: var(--accent);
  }

  .primary-action {
    color: #ffffff;
    background: var(--accent-strong);
    border-color: var(--accent-strong);
  }

  .tool-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .control-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .elo-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 88px;
    gap: 10px;
    align-items: center;
    margin-top: 12px;
  }

  .elo-row label,
  .viewer-select span {
    color: var(--muted);
    font-size: 11px;
    font-weight: 700;
  }

  .elo-row input {
    width: 100%;
    height: 34px;
    padding: 0 8px;
    color: var(--text);
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
    font-variant-numeric: tabular-nums;
  }

  .note-pill {
    display: inline-flex;
    margin-top: 6px;
    padding: 3px 7px;
    color: var(--gold);
    background: var(--gold-soft);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 650;
  }

  .opening-list,
  .explain-list {
    display: grid;
    gap: 8px;
    margin: 0;
    padding: 0;
    list-style: none;
  }

  .opening-list li,
  .explain-item {
    min-width: 0;
    padding: 10px;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  .opening-list li {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .opening-list strong,
  .opening-list span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13px;
  }

  .opening-list span,
  .explain-meta,
  .copy-status {
    color: var(--muted);
    font-size: 12px;
  }

  .explain-item[aria-current="true"] {
    background: var(--accent-soft);
    border-color: var(--accent);
  }

  .explain-title {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 5px;
    font-size: 13px;
    font-weight: 750;
  }

  .explain-body {
    margin: 0;
    color: #3a3a3c;
    font-size: 12.5px;
    line-height: 1.5;
  }

  .pgn-viewer {
    display: grid;
    gap: 10px;
    margin-bottom: 16px;
    padding: 12px;
    color: var(--text);
    background: #f5f5f7;
    border: 1px solid #e5e5ea;
    border-radius: 8px;
  }

  .pgn-viewer-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    min-width: 0;
  }

  .pgn-viewer-head h3 {
    margin: 0;
    color: var(--text);
    font-size: 18px;
    line-height: 1.25;
  }

  .pgn-viewer-head span {
    display: block;
    margin-top: 4px;
    overflow-wrap: anywhere;
    color: var(--muted);
    font-size: 12px;
    line-height: 1.4;
  }

  .board-frame {
    display: grid;
    place-items: center;
    width: 100%;
    min-width: 0;
  }

  #board {
    width: min(100%, 620px);
    aspect-ratio: 1;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.12), 0 12px 34px rgba(0, 0, 0, 0.12);
  }

  #board coords {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-weight: 700;
  }

  .board-toolbar,
  .moves-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    justify-content: space-between;
  }

  .move-nav {
    display: flex;
    gap: 8px;
  }

  .move-list {
    min-height: 96px;
    max-height: 220px;
    overflow-y: auto;
    color: #3a3a3c;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.65;
  }

  .move-number {
    color: var(--muted);
    font-weight: 700;
  }

  .move-token {
    min-height: 26px;
    margin: 0 2px 4px 0;
    padding: 2px 6px;
    color: var(--text);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 6px;
    font-family: inherit;
  }

  .move-token:hover,
  .move-token[aria-current="true"] {
    color: #174b7c;
    background: var(--accent-soft);
    border-color: rgba(42, 110, 178, 0.22);
  }

  .empty-state {
    padding: 22px;
    color: var(--muted);
    text-align: center;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 8px;
  }

  @keyframes paneIn {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @media (max-width: 900px) {
    body {
      overflow: auto;
    }

    .app-shell {
      height: auto;
      min-height: 100dvh;
    }

    .topbar {
      grid-template-columns: 1fr;
    }

    .workspace {
      grid-template-columns: 1fr;
      overflow: visible;
      padding: 14px 12px 24px;
    }

    .content-pane,
    .detail-pane {
      max-height: none;
      overflow: visible;
    }

    .detail-pane {
      order: -1;
      padding: 16px;
    }
  }

  @media (max-width: 720px) {
    .topbar {
      padding: 12px;
    }

    .control-grid {
      grid-template-columns: 1fr;
    }

    .rating-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .rating-card {
      padding: 8px;
    }

    .rating-card strong {
      font-size: 17px;
    }

    .pgn-viewer-head,
    .board-toolbar,
    .moves-toolbar {
      display: grid;
      justify-items: stretch;
    }

    .move-nav {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .move-nav .tool-button,
    .moves-toolbar .tool-button {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="../../docs/index.html" aria-label="返回棋手库">
        <span class="brand-mark" aria-hidden="true">♜</span>
        <span>
          <strong>中国青少年棋手库</strong>
          <small>FIDE ELO · 李成智杯年龄组</small>
        </span>
      </a>

      <div class="search-wrap">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="routeSummary" type="search" placeholder="搜索棋手姓名或 FIDE ID" autocomplete="off">
        </label>
        <div id="routeSearchResults" class="search-results" role="listbox" hidden></div>
      </div>
    </header>

    <main class="workspace">
      <section class="content-pane">
        <section class="leaderboard-card" aria-label="对局控制">
          <div class="section-heading">
            <h1>模拟对局</h1>
            <span id="controlMeta">BETA</span>
          </div>
          <div class="control-grid">
            <button id="playWhite" class="primary-action" type="button">执白开局</button>
            <button id="playBlack" class="primary-action" type="button">执黑开局</button>
          </div>
          <div class="elo-row">
            <label for="elo">限强等级</label>
            <input id="elo" type="number" value="2050" min="1320" max="3190" step="10">
          </div>
          <span class="note-pill" id="styleNote">画像加载中</span>
        </section>

        <section class="leaderboard-card" aria-label="风格摘要">
          <div class="section-heading">
            <h2>风格摘要</h2>
            <span id="bookMeta">开局库</span>
          </div>
          <ul class="opening-list" id="openingList"></ul>
        </section>

        <section class="leaderboard-card" aria-label="引擎解释">
          <div class="section-heading">
            <h2>着法解释</h2>
            <span id="explainCount">0 条</span>
          </div>
          <div id="explanations" class="empty-state">引擎走棋后会显示每一步的来源、候选和风格采样原因。</div>
        </section>
      </section>

      <aside class="detail-pane" aria-label="在线棋盘">
        <section class="pgn-viewer" aria-label="棋盘">
          <div class="pgn-viewer-head">
            <div>
              <h3 id="status">加载引擎中...</h3>
              <span id="source"></span>
            </div>
            <button id="flipBoard" class="tool-button" type="button" title="翻转棋盘" aria-label="翻转棋盘">↕</button>
          </div>
          <div class="board-frame">
            <div id="board" class="brown cburnett"></div>
          </div>
          <div class="board-toolbar">
            <div class="move-nav">
              <button id="prevMove" class="tool-button" type="button">后退</button>
              <button id="nextMove" class="tool-button" type="button">前进</button>
            </div>
            <button id="undo" class="tool-button" type="button">悔棋</button>
          </div>
        </section>

        <section class="pgn-viewer" aria-label="棋谱">
          <div class="pgn-viewer-head">
            <div>
              <h3>棋谱</h3>
              <span id="moveCount">0 手</span>
            </div>
            <div class="moves-toolbar">
              <span id="copyStatus" class="copy-status" aria-live="polite"></span>
              <button id="copyPgn" class="tool-button" type="button">复制 PGN</button>
            </div>
          </div>
          <div id="moves" class="move-list">（对局尚未开始）</div>
        </section>
      </aside>
    </main>
  </div>

  <script src="profile.js"></script>
  <script src="mimic_core.js"></script>
  <script type="module">
    import { Chess } from "./vendor/chess.js";
    window.Chess = Chess;
    import("./app.js");
  </script>
</body>
</html>
